# Deploy ICOCO website to GitHub Pages on every push to main,
# and on pushes to collab-1108 so design iterations get a shareable preview.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main, collab-1108]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Production (www.icoco.art) is served from the domain root, so
      # vite.config keeps base '/'. GitHub Pages serves this repo under
      # /icoco-website/, so the preview build overrides the base to match.
      - run: npm run build -- --base=/icoco-website/
      # Deep links (/about, /news/...) are client-rendered; Pages serves
      # 404.html for unknown paths, so a copy of index.html keeps them working.
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
