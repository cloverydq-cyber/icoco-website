# Drop this inside the existing `server { ... }` block that serves www.icoco.art.
# It keeps the marketing site untouched and forwards only /survey-api/* to the
# Node service on loopback.

location /survey-api/ {
    proxy_pass http://127.0.0.1:8787;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;

    client_max_body_size 64k;
    proxy_read_timeout 30s;
    proxy_connect_timeout 5s;
}

# The form itself is a static file that ships with the marketing build
# (public/survey/index.html -> /survey/index.html). If that build is not in
# place yet, serve it straight from the deploy folder instead:
#
# location = /survey/ {
#     root /var/www/icoco-survey/public;
#     try_files /survey/index.html =404;
# }
