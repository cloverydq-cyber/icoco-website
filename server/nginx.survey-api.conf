# Drop this inside the existing `server { ... }` block that serves www.icoco.art.
# It keeps the marketing site untouched and forwards only /survey-api/* to the
# Node service on loopback.

location /survey-api/ {
    proxy_pass http://127.0.0.1:8787;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;

    client_max_body_size 64k;
    proxy_read_timeout 30s;
    proxy_connect_timeout 5s;
}

# The form itself lives on the marketing site's /contact page, served by the
# existing site config — nothing else to wire up here. GET /survey/* on the
# Node service redirects to /contact as a courtesy for old links.
